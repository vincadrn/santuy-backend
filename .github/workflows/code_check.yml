name: Code check

on:
  workflow_call:

jobs:
  build:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
    - name: Lint check
      uses: golangci/golangci-lint-action@v9

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Unit tests
      run: go test ./...
