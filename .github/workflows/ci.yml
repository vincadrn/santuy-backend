name: CI

on:
  push:
    branches: [ "dev" ]
    paths-ignore:
      - .github/workflows/**

  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - .github/workflows/**

jobs:
  init:
    name: Init
    runs-on: ubuntu-latest
    steps:
      - name: Check if merge commit
        id: check_merge_commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          parents=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
              --jq '.parents | length')

          if ((parents > 1)); then
              echo "is_merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323
        with:
          files_yaml: |
            code:
              - '*.go'
              - '**/*.go'
            db_migration:
              - migration/**
    outputs:
      code-changes-exist: ${{ steps.changed-files.outputs.code_all_changed_and_modified_files_count > 0 }}
      db-migration-changes-exist: ${{ steps.changed-files.outputs.db_migration_all_changed_and_modified_files_count > 0 }}

  code_check:
    name: Code check
    needs: [init]
    if: ${{ needs.init.outputs.is_merged == 'true' && needs.init.outputs.code-changes-exist == 'true' }}
    uses: vincadrn/santuy-backend/.github/workflows/code_check.yml@dev

  db_migration_check:
    name: Database migration check
    needs: [init]
    if: ${{ needs.init.outputs.is_merged == 'true' && needs.init.outputs.db-migration-changes-exist == 'true' }}
    uses: vincadrn/santuy-backend/.github/workflows/db_migration_check.yml@dev
    with:
      environment: dev
      directory: migration
    secrets:
      GOOSE_DRIVER: ${{ secrets.GOOSE_DRIVER }}
      GOOSE_DBSTRING: ${{ secrets.GOOSE_DBSTRING }}
