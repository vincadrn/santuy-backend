name: DB Migration Check

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

      directory:
        required: true
        type: string

    secrets:
      GOOSE_DRIVER:
        required: true

      GOOSE_DBSTRING:
        required: true

jobs:
  build:
    name: Validate migration files
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      # See https://pressly.github.io/goose/installation
      - name: Install goose
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/pressly/goose/master/install.sh |\
            sh

      - name: Check current goose migration status
        id: check_migration
        env:
          GOOSE_DRIVER: ${{ secrets.GOOSE_DRIVER }}
          GOOSE_DBSTRING: ${{ secrets.GOOSE_DBSTRING }}
          GOOSE_MIGRATION_DIR: ${{ inputs.directory }}

        run: |
          {
            echo 'GOOSE_MIGRATION_VERSION<<EOF'
            goose version 2>&1
            echo 'EOF'
          } >> $GITHUB_OUTPUT

          {
            echo 'GOOSE_MIGRATION_STATUS<<EOF'
            goose status 2>&1
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Find similar comment in PR
        id: find_comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: Database migration status

      - name: Create or update comment in PR
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.find_comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            **Database migration status:**
            ${{ steps.check_migration.outputs.GOOSE_MIGRATION_VERSION }}
            ${{ steps.check_migration.outputs.GOOSE_MIGRATION_STATUS }}
