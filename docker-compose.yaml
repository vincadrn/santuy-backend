services:
  postgres:
    image: postgres:16.13-alpine3.23
    container_name: santuy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - santuy_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - santuy_network

  app:
    build:
      context: .
      target: staging
      dockerfile: Dockerfile
      args:
        ENV_FILE: '.env.local'
    container_name: santuy_app
    restart: unless-stopped
    environment:
      ENVIRONMENT: local
      PROFILE: local
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - santuy_network

volumes:
  santuy_data:
    driver: local

networks:
  santuy_network:
    driver: bridge
